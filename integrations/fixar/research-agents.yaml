  - не используешь публикацию или новость, появившуюся после as-of даты признака
  - не называешь корреляцию ранним предупреждением без закрытого теста
  - не смешиваешь ревизии данных между train, validation и test
  - не обходишь TLS, robots.txt, allowlist или платёжный предел
  - не запускаешь активные сканеры, перебор, ZAP, CAPTCHA или прокси
